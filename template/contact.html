{% extends 'base.html' %}

{% block title %}Contact Us{% endblock title %}

{% block body %}
<div class="container-fluid p-0">
    <img src="https://images.unsplash.com/photo-1520923642038-b4259acecbd7?q=80&w=1920&auto=format&fit=crop"
        class="d-block w-100 mx-0" alt="Contact Us">
</div>
<h2 class="text-center dark">
    Contact Us
</h2>
<div class="container">
    {% csrf_token %}
    <form class="row g-3">
        <div class="col-md-6">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required placeholder="Enter your name">
        </div>
        <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="Enter your email">
        </div>
        <div class="col-5">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone" required
                placeholder="Enter your phone number">
        </div>
        <div class="form-floating">
            <textarea class="form-control" placeholder="Tell me reason for contacting" id="floatingTextarea"></textarea>
            <label for="floatingTextarea">Tell me reason for contacting</label>
        </div>
        <div class="col-12 py-3">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>
    </form>
</div>
{% endblock body %}
